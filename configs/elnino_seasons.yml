# El Niño hazard composites: country season configuration
# Spec: docs/specs/elnino-hazard-composites.md (v0.2.0)
# Priority A countries confirmed 3 Oct 2026. Hydrodrought and scenario WIA runs (3b) are out of scope.
#
# Conventions
# - A season instance ends on the last day of `end_month` in the season-end year t, with
#   `length_months` months of lookback. A run entry may override end_month / length_months.
# - ERA5-Drought accumulations: 1, 3, 6, 12 (24/36/48). With `evaluation: end`,
#   accumulation must equal the window length.
# - enso_ref: the 3-month ONI season used to classify the instance. Its central month must be
#   Jul-Dec. `central_year_offset` is the year of that central month relative to t (ONI labels use
#   the central-month year: "NDJ 2015" = Nov 2015-Jan 2016). Y0 seasons: offset 0. Y+1 seasons:
#   NDJ with offset -1.
# - expected: direction El Niño is expected to push the metric (increase | decrease | either).
#   Default increase. Used for one-sided tests, exceedance tail and analogue counts.
# - Variant token for drought_seasonal / wet_extreme = <index><accumulation><evaluation>, e.g. spi3end.
# - Season windows are a first proposal; check against ICPAC / SADC CSC calendars before roll-out.

version: 0.2.0

record:
  start_year: 1981          # 1951 supported; pre-1979 instances flagged pre_satellite
  end_year: 2025
  out_of_sample: [2026]     # seasons already observed in 2026 (intermediate ERA5 tier)

oni:
  source_url: https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt
  episode_threshold_c: 0.5
  min_consecutive_seasons: 5
  classes: {weak: 0.5, moderate: 1.0, strong: 1.5, very_strong: 2.0}
  composite_min_class: moderate

core_analogues: ["1982-83", "1997-98", "2015-16", "2023-24"]   # episode IDs: Y0 from peak season
forecast_oni_ref: 2.5      # NOAA CPC 10 Sep 2026: 75% chance > +2.5 C in OND 2026

neutral_baseline:
  oni_abs_max: 0.5
  local_window_years: 10
  min_neutral_seasons: 8

statistics:
  permutations: 10000
  seed: 20261003
  fdr_q: 0.10
  exceedance_percentile: 80     # 20 for expected: decrease
  zero_inflated_share: 0.5
  risk_ratio_high: 1.5
  analogue_consistent_min: 3

thresholds:
  dry: [-1.0, -1.5, -2.0]     # reporting -1.5
  wet: [1.0, 1.5, 2.0]        # reporting +1.5
  heat_c: [32, 38, 46]        # reporting: country heat_headline_c

worldpop_year: 2025

flood:
  start_year: 2015
  min_median_valid_obs_days: 4   # seasons below this are flagged low_coverage (tune after SOM)

fonts:
  inter_dir: null   # set to the Inter folder in the WIA brand book "Document fonts"; Arial fallback

anomaly_map_limits:           # fixed symmetric limits for anomaly PNGs
  index: 1.5                  # SPEI/SPI units
  utci_max_c: 3.0
  days_count: 20

countries:

  SOM:
    covariates: [dmi]
    heat_headline_c: 38       # confirm against current SOM WIA run
    wia_baseline_csv: null    # step 3c input, optional
    seasons:
      - id: deyr_ond
        end_month: 12
        length_months: 3
        enso_ref: {season: OND, central_year_offset: 0}
        runs:
          - {hazard: drought_seasonal, index: spei, accumulation: 3, evaluation: end, expected: decrease}
          - {hazard: wet_extreme, index: spi, accumulation: 3, evaluation: end, expected: increase}
          - {hazard: wet_extreme, index: spi, accumulation: 1, evaluation: any, expected: increase}
          - {hazard: wet_extreme, index: spi, accumulation: 6, evaluation: end, end_month: 12, length_months: 6, expected: increase}  # Jul-Dec, Juba-Shabelle
          - {hazard: flood, expected: increase}
      - id: heat_jfm_y1
        end_month: 3
        length_months: 3
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: heat, expected: increase}

  KEN:
    covariates: [dmi]
    heat_headline_c: 38       # confirm against current KEN WIA run
    wia_baseline_csv: null
    seasons:
      - id: short_rains_ond
        end_month: 12
        length_months: 3
        enso_ref: {season: OND, central_year_offset: 0}
        runs:
          - {hazard: drought_seasonal, index: spei, accumulation: 3, evaluation: end, expected: decrease}
          - {hazard: wet_extreme, index: spi, accumulation: 3, evaluation: end, expected: increase}
          - {hazard: wet_extreme, index: spi, accumulation: 1, evaluation: any, expected: increase}
          - {hazard: flood, expected: increase}
      - id: heat_jfm_y1
        end_month: 3
        length_months: 3
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: heat, expected: increase}

  SSD:
    covariates: [dmi]
    heat_headline_c: 38       # confirm against current SSD WIA run
    wia_baseline_csv: null
    seasons:
      - id: rains_jas
        end_month: 9
        length_months: 3
        enso_ref: {season: JAS, central_year_offset: 0}
        runs:
          - {hazard: drought_seasonal, index: spei, accumulation: 3, evaluation: end, expected: either}
          - {hazard: wet_extreme, index: spi, accumulation: 3, evaluation: end, expected: either}
          - {hazard: wet_extreme, index: spi, accumulation: 1, evaluation: any, expected: either}
      - id: flood_jul_dec_y0
        end_month: 12
        length_months: 6
        enso_ref: {season: ASO, central_year_offset: 0}
        runs:
          - {hazard: wet_extreme, index: spi, accumulation: 6, evaluation: end, expected: increase}
          - {hazard: flood, expected: increase}
      - id: flood_jul_dec_y1          # same windows as y0: runs are deduplicated, classified separately
        end_month: 12
        length_months: 6
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: wet_extreme, index: spi, accumulation: 6, evaluation: end, expected: increase}
          - {hazard: flood, expected: increase}
      - id: heat_fma_y1
        end_month: 4
        length_months: 3
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: heat, expected: increase}

  SDN:
    covariates: []
    heat_headline_c: 38       # confirm against current SDN WIA run
    wia_baseline_csv: null
    seasons:
      - id: rains_jas                 # pilot (gate 2) incl. 2026 out-of-sample
        end_month: 9
        length_months: 3
        enso_ref: {season: JAS, central_year_offset: 0}
        runs:
          - {hazard: drought_seasonal, index: spei, accumulation: 3, evaluation: end, expected: increase}
          - {hazard: wet_extreme, index: spi, accumulation: 3, evaluation: end, expected: either}
      - id: flood_jaso
        end_month: 10
        length_months: 4
        enso_ref: {season: JAS, central_year_offset: 0}
        runs:
          - {hazard: flood, expected: either}
      - id: heat_amj_y1
        end_month: 6
        length_months: 3
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: heat, expected: increase}

  MOZ:
    covariates: []
    heat_headline_c: 38       # confirm against current MOZ WIA run
    wia_baseline_csv: null
    seasons:
      - id: rains_ndjfma
        end_month: 4
        length_months: 6
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: drought_seasonal, index: spei, accumulation: 6, evaluation: end, expected: increase}
          - {hazard: wet_extreme, index: spi, accumulation: 6, evaluation: end, expected: either}   # north above normal, south below
          - {hazard: wet_extreme, index: spi, accumulation: 1, evaluation: any, expected: either}
      - id: flood_djfm
        end_month: 3
        length_months: 4
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: flood, expected: either}
      - id: heat_ondjf
        end_month: 2
        length_months: 5
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: heat, expected: increase}

  MDG:
    covariates: []
    heat_headline_c: 38       # confirm against current MDG WIA run
    wia_baseline_csv: null
    seasons:
      - id: rains_ndjfma
        end_month: 4
        length_months: 6
        enso_ref: {season: NDJ, central_year_offset: -1}
        runs:
          - {hazard: drought_seasonal, index: spei, accumulation: 6, evaluation: end, expected: increase}
          - {hazard: wet_extreme, index: spi, accumulation: 6, evaluation: end, expected: either}
          - {hazard: wet_extreme, index: spi, accumulation: 1, evaluation: any, expected: either}
      - id: flood_djfm
        end_month: 3
        length_months: 4
        enso_ref: {season: NDJ, central_year_offset: -1}
