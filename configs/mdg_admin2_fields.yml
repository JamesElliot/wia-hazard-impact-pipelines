# MDG admin2 field mapping for the cyclone/earthquake YAML-config pipelines.
# MDG resolves (via data/cod-ab/mdg/admin_source.json) to the per-country
# COD-AB override admin_boundaries.gpkg, not the global matched archive
# (Madagascar is absent from data/cod-ab/global_admin_boundaries_matched_latest.gdb.zip),
# so the shared default.yml's uppercase HDX-style field names (ADM2_PCODE,
# ADM2_EN, ADM2_REF) don't exist on this source. This file fills in the
# lowercase field names against that gpkg's actual admin2 schema (same
# pattern as configs/moz_admin2_fields.yml).
admin:
  fields:
    adm0_pcode: adm0_pcode
    adm1_pcode: adm1_pcode
    adm2_pcode: adm2_pcode
    adm2_name_en: adm2_name
    adm2_name_local: adm2_name
    iso3: iso3
